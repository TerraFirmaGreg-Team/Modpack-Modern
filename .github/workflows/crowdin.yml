name: "Crowdin Translations"
run-name: "[🌐]: Crowdin Translations #${{ github.run_number }}"

on:
  push:
    branches: [dev]
    paths:
      - 'kubejs/assets/**/lang/en_us.json'
      - 'kubejs/assets/**/lang/en_us/**/*.json'
      - 'kubejs/assets/**/patchouli_books/**/en_us/**/*.json'
  workflow_dispatch:
    inputs:
      create_pr:
        description: "Create Pull Request after sync"
        type: boolean
        default: false
        required: true
  schedule:
    - cron: '0 3 */2 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  LOCALIZATION_BRANCH: translations
  TARGET_BRANCH: dev

jobs:
  sync-patchouli:
    name: "[🔄] Sync Patchouli"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Crowdin"
        uses: TerraFirmaGreg-Team/Actions/crowdin/sync@main
        with:
          config: .github/config/crowdin/patchouli.yml
          download_translations: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          localization_branch: ${{ env.LOCALIZATION_BRANCH }}
          target_branch: ${{ env.TARGET_BRANCH }}
          crowdin_token: ${{ secrets.CROWDIN_TOKEN }}
          crowdin_id: ${{ vars.CROWDIN_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  sync-language:
    name: "[🔄] Sync Language"
    runs-on: ubuntu-latest
    needs: [sync-patchouli]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Crowdin"
        uses: TerraFirmaGreg-Team/Actions/crowdin/sync@main
        with:
          config: .github/config/crowdin/lang.yml
          download_translations: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          skip_untranslated_strings: true
          localization_branch: ${{ env.LOCALIZATION_BRANCH }}
          target_branch: ${{ env.TARGET_BRANCH }}
          crowdin_token: ${{ secrets.CROWDIN_TOKEN }}
          crowdin_id: ${{ vars.CROWDIN_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  cleanup-empty-files:
    name: "[🛠️] Post-process Translations"
    runs-on: ubuntu-latest
    needs: [sync-patchouli, sync-language]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: "Post-process translations"
        uses: TerraFirmaGreg-Team/Actions/crowdin/postprocess@main
        with:
          localization_branch: ${{ env.LOCALIZATION_BRANCH }}

  create-pr:
    name: "[🤝] Create Pull Request"
    runs-on: ubuntu-latest
    needs: [cleanup-empty-files]
    if: (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.create_pr)
    steps:
      - name: "Generate GitHub App Token"
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: "Create Pull Request"
        id: create_pr
        uses: TerraFirmaGreg-Team/Actions/pull-request/create@main
        with:
          source_branch: ${{ env.LOCALIZATION_BRANCH }}
          target_branch: ${{ env.TARGET_BRANCH }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          label: "Pull request: Translation"
          title: 'add: New Crowdin translations'
          body: |
            ## 🌐 New translations from Crowdin

            ### 🔄 Changes
            - Updated translation files
            - Patchouli book translations

      - name: "Automatically Merge PR"
        uses: TerraFirmaGreg-Team/Actions/pull-request/automerge@main
        with:
          github_token: ${{ steps.generate_token.outputs.token }}
          pull_request: ${{ steps.create_pr.outputs.pr_number }}
