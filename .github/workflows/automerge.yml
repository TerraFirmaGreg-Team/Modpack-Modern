name: "Automerge"
run-name: "[🔀]: Automerge #${{ github.run_number }}"

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "PR number to merge when ready"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: "[🔀] Merge when ready"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'dev' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: TerraFirmaGreg-Team/Actions/pull-request/automerge@main
        with:
          app_client_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          pull_request: ${{ inputs.pull_request || github.event.pull_request.number }}
          merge_method: merge
          auto_merge: "true"
