name: "Project Server News"
run-name: "[📨]: Project Server News #${{ github.run_number }}"
on:
  workflow_dispatch:
    inputs:
      project_version:
        required: true
        type: string

jobs:
  discord-message:
    name: 📱 Discord Message
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        uses: TerraFirmaGreg-Team/Actions/discord@main
        with:
          webhook_key: ${{ secrets.DISCORD_NEWS_SERVER }}
          allowed_mentions_parse_users: true
          mention: "@Xikaro"
          content: |
            **Server updated to**: `${{ inputs.project_version }}`
